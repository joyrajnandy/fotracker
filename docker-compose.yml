services:
  # ─── FastAPI Backend (Lightweight with SQLite WAL) ──────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fo_tracker_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////app/data/fotracker.db
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-in-production}
      DEBUG: "False"
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000","http://localhost:80"]'
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  # ─── React Frontend (Vite) ──────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fo_tracker_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://backend:8000
